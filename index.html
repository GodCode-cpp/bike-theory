<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motorbike Theory Practice</title>
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e2e0d8;
  --accent:#c8102e; --accent-ink:#ffffff; --ok:#1b7f3b; --ok-bg:#e6f4ea; --bad:#b3261e; --bad-bg:#fce8e6;
  --bar:#e2e0d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --card:#202026; --ink:#f0eee8; --muted:#9a988f; --line:#33333b;
    --accent:#e5344f; --ok:#5cc47a; --ok-bg:#183323; --bad:#ff8a80; --bad-bg:#3a1c1a; --bar:#33333b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 2px}
h2{font-size:18px;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile:hover{border-color:var(--accent)}
.tile b{display:block}
.tile span{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.q{font-size:20px;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt kbd{display:inline-block;width:22px;color:var(--muted);font:600 13px ui-monospace,Menlo,monospace}
.exp{margin-top:12px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0}
.signimg{display:block;max-width:240px;width:100%;margin:6px auto 14px;border-radius:8px}
.signimg.wide{max-width:420px;aspect-ratio:1027/740;object-fit:cover;object-position:top}
.big{font-size:44px;font-weight:700;line-height:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.miss{padding:12px 0;border-top:1px solid var(--line)}
.miss:first-child{border-top:0}
.link{background:none;border:0;color:var(--muted);padding:0;text-decoration:underline}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 12px}
.seg button{background:var(--card);border:0;padding:8px 14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.opt.sel{border-color:var(--accent);background:var(--card);box-shadow:inset 0 0 0 1px var(--accent)}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 18px}
.stats b{text-align:right}
.verdict{font-size:20px;font-weight:700;margin:12px 0 0}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--bad)}
</style>
<meta name="theme-color" content="#c8102e">

<script>
// [lesson, BIKE.pdf page, question, correct answer, [3 wrong answers], explanation]
const LESSONS = {
  "1": "Personal requirements, clothing & anatomy",
  "2": "Road safety, environment & licence classes",
  "3": "Moving off, gears, braking & cornering",
  "4": "Critical situations, signs & road surfaces",
  "5": "See & be seen, pillion, groups",
  "6": "Dangers from others & hard conditions",
  "7": "Sidecar, trailer, accidents & scooters",
  "8": "Yard test exercises (Class A)"
};

const Q = [
[1,5,"Which four things make up safe motorbike riding in the handbook?","Behaviour, knowledge, attitude and ability",["Balance, speed, experience and equipment","Fitness, protection, concentration and luck","Training, licence, insurance and roadworthiness"],"The handbook's safe-riding diagram joins behaviour, knowledge, attitude and ability."],
[1,6,"Why is physical fitness more important for a rider than for a car driver?","Riding is more strenuous, and tiredness sets in faster, especially when cold or wet",["Riders sit for longer hours than drivers, and stiffness sets in faster, especially in hot weather","Riders carry heavier loads than drivers, and muscles tire sooner, especially on gravel roads","A bike has constant gear changing, so grip strength matters more, especially at slow town speeds"],"A rider must make up for the higher accident risk with faster reflexes, reaction and foresight."],
[1,7,"Which of these is an effect of alcohol on riding ability?","Slower reactions and over-estimating your own abilities",["Sharper reactions and under-estimating your own abilities","Slower reactions and improved balance at low speeds","Quicker reflexes and over-estimating other riders' abilities"],"Alcohol disturbs equilibrium, slows reactions and makes you misjudge your own speed and other road users' speed."],
[1,7,"Which is a special effect of alcohol on your vision?","Tunnel or double vision",["Sharper focus at long range","Reduced sensitivity to dazzle","Improved judgement of distance"],"Alcohol also reduces the power to see a red light, increases sensitivity to dazzling and causes misjudgement of distance and speed."],
[1,8,"A blood alcohol level of 0.08% is the same as:","80 mg per 100 ml of blood",["8 mg per 100 ml of blood","800 mg per 100 ml of blood","0.8 g per 100 ml of blood"],"The percentage expresses the alcohol level in 100 ml of blood: 0.08% = 80 mg/100 ml."],
[1,8,"What does the handbook say about riders consuming drugs, alcohol or other intoxicating substances?","It is strictly forbidden",["It is allowed in small amounts","It is only banned at night","It is only forbidden on highways"],"With increased alcohol consumption, safe riding is impossible."],
[1,8,"What must you remember when taking medicine before riding?","Even a small quantity can affect your ability to ride, so read the instructions or ask your doctor",["Medicine only matters in large doses, so check the leaflet only when you feel drowsy or unwell","Only prescription medicine matters, so ask your doctor and ride as normal after ordinary tablets","Medicine is safe if taken with food, so read the instructions and ride after a short rest"],"The period of effectiveness must be observed. If you feel uncomfortable or sick, do not ride."],
[1,9,"When the bike is stationary, how much of your foot should be able to touch the ground?","The whole foot",["The ball of the foot","Just the toes","Only the heel"],"Basic requirements: upright seating position, slightly bent arms and the whole foot on the ground at a stop."],
[1,9,"What is a danger of riding a motorbike that is too big for you?","Danger of tipping over at stops",["Danger of wheelspin when moving off","Danger of overheating in traffic jams","Danger of stalling on gradients"],"A too-big bike also causes fear or panic, unsafe riding behaviour and a tense seating position."],
[1,9,"What is a danger of riding a motorbike that is too small for you?","Handling at slow speed is affected and the steering angle is reduced",["Handling at high speed is affected and the steering angle is increased","The bike tips over at stops and the turning radius is reduced","Braking distance is affected and the ground clearance is reduced"],"A too-small bike can also numb knee and foot joints and changes the centre of gravity."],
[1,10,"Why should a good rider opt for proper protective clothing?","It protects against injuries in a fall, protects in cold weather and helps you to be noticed",["It improves aerodynamics at speed, protects in warm weather and helps you to be heard by others","It reduces engine noise, protects against theft and helps you to be taken seriously by police","It lowers insurance costs, protects in hot weather and helps you to be noticed by drivers"],""],
[1,10,"Which body parts are endangered 'very often' in an accident or fall?","Legs and hands",["Upper arms and feet","Chest and shoulders","Neck and lower back"],"Head: often. Legs and hands: very often. Upper arms and feet: not so often."],
[1,11,"Who is required by law to wear a helmet?","All riders and all pillions",["Riders, but not their pillions","Only riders of heavy motorbikes","Only riders on public roads at night"],""],
[1,11,"Which is a requirement when buying a helmet?","It must fit tightly without pinching and must not shake when you move your head",["It must fit loosely to avoid pressure and may move slightly when you turn your head","It must fit tightly enough to pinch so that it cannot shift in a crash","It should be a size larger so glasses fit and the chin strap can stay open on short trips"],"Keep the helmet on for a few minutes to find pressure spots. If you wear glasses, try them on with the helmet."],
[1,12,"Why should you buy a high-quality helmet?","It spreads the impact force over the whole shell, lowering the risk of skull fractures and concussion",["It is stiffer and heavier, so it stays rigid on impact and shields the head from rotation injuries","It is built from one rigid layer, which absorbs the whole impact at the point of contact","It carries a higher price mark, so the law no longer requires the chin strap to be fastened"],"It is also lighter, more comfortable, quieter and less tiring."],
[1,13,"What is the ECE-Norm?","A quality standard mark, normally stitched on the chin strap",["A speed rating mark, normally printed on the visor edge","A noise limit label, normally stuck inside the helmet shell","A safety certificate, normally issued by the licensing office"],"Wear approved helmets, ideally of the latest ECE-Norm version."],
[1,13,"How should you use the chin strap?","Always fasten it firmly, before putting on gloves",["Fasten it loosely for comfort, after putting on gloves","Fasten it only on highways, before putting on gloves","Leave the pillion's strap open, but fasten the rider's strap firmly"],"Open and close the snap fastener several times before using a new helmet. Check your pillion's chin strap too."],
[1,13,"Which is a characteristic of a good visor?","Scratch resistant, water resistant, with ventilation to prevent steaming up",["Heat resistant, dark tinted, with a fixed single stage to prevent wind rattle","Tinted dark for sun protection, with a narrow view to reduce wind noise and dazzle","Scratch resistant, shock absorbing, with a locking catch that needs two hands to open"],"A good visor has at least 2 stages, can be operated with one hand and gives a wide-angle view."],
[1,14,"What is a disadvantage of leather protective clothing?","It gives no protection when riding a long time in rain or cool weather",["It becomes heavy and tears easily when riding a long time in hot weather","It is loose fitting and restricts movement when riding a long time in a crouch","It cannot carry protectors, so it gives little protection in a sudden fall"],"Leather features: tight fit, flexibility and very high resistance to tearing."],
[1,14,"Which is a feature of textile protective clothing?","Mostly water resistant, with a removable warm lining",["Mostly heat sensitive, with a fixed warm lining","Mostly tight fitting, with built-in leather panels","Mostly very heavy, with fixed non-removable protectors"],"It also has built-in ventilation, good resistance against tearing and heat, removable protectors and is light."],
[1,15,"What do back protectors protect against?","Back injuries (paraplegia)",["Neck injuries (whiplash)","Head injuries (concussion)","Hand injuries (fractures)"],"They are often designed as a kidney belt and are integrated in jackets or worn separately."],
[1,15,"Which is an advantage of wearing gloves?","Protection against the weather and against injuries in a sudden fall",["Protection against engine heat and against vibration on a long ride","Protection against wet roads and against wind noise on a long ride","Better grip on the road and protection against stone chips"],"Gloves also improve grip on the throttle, brake and clutch lever and have a reflective signalling effect."],
[1,15,"Which is an advantage of good boots?","They protect against hot exhaust pipes and support the ankle",["They protect against wet roads and loosen the ankle for gear changes","They protect against chain oil and keep the foot flat on the peg","They protect against sparks and lift the heel off the foot rest"],"The heel also stops the foot slipping off the foot rest."],
[1,16,"Why should you wear a kidney belt?","It keeps the kidneys warm and protects against shocks, preventing long-term kidney damage",["It keeps the back muscles loose and absorbs vibration, preventing long-term spine damage","It holds the jacket in place and cuts wind noise, preventing long-term hearing damage","It keeps the stomach warm and supports the abdomen, preventing long-term digestive problems"],""],
[1,16,"Why wear a scarf?","It protects against draught, cold and wetness, and the throat against flying insects",["It protects against sunburn, heat and glare, and the neck against passing stones","It protects against noise, cold and fumes, and the chin against flying stones","It protects against dust, drought and tiredness, and the ears against wind buffeting"],""],
[1,16,"Why do you need a balaclava?","It warms you, reduces drowsiness and absorbs sweat to keep the helmet lining clean",["It cools you, reduces glare and absorbs wind noise to keep the helmet ventilated","It warms you, reduces headaches and replaces the helmet lining on long journeys","It holds the visor in place, reduces wind pressure and keeps the strap from rubbing"],""],
[1,17,"What should you know about reflective clothing?","It makes you more visible at dawn, in darkness and in bad weather",["It makes you more visible in daylight, but is not helpful at night or in fog","It makes you visible mostly in towns, but is unnecessary on open country roads","It makes you more visible to oncoming traffic only, not to vehicles from behind"],"In most clothing products it is unobtrusive during daylight."],
[1,17,"Why is a full set of protective clothing also important for the pillion?","The pillion is less prepared for a sudden fall and cools down faster",["The pillion is better prepared for a fall and cools down slower","The pillion sits lower than the rider and gets less wind turbulence","The pillion has less weight on the bike and so is at lower risk in a fall"],"The pillion's injury risk is much higher, wind turbulence on the head is stronger and the motionless body cools faster."],
[1,19,"Which engine types are common for bikes?","4-stroke and 2-stroke engines",["Rotary and 4-stroke engines","Diesel and 2-stroke engines","Electric and 2-stroke engines"],""],
[1,20,"What is an advantage of a universal (shaft) drive?","It is low on maintenance",["It is lighter than a chain","It has no load change reactions","It uses a lighter oil"],"Disadvantages: high weight and load-change reactions (elevator effect)."],
[1,20,"What is true of a chain drive?","It is service and maintenance intensive and has more wear than other drives",["It is low on maintenance and has less wear than other drives","It is quiet and clean and lasts almost double the life of a belt","It is heavy and sealed and loses a lot of power at low torque"],"A toothed belt drive needs hardly any service and lasts almost double the life of a chain."],
[1,21,"Which brake type is vulnerable to water and dust and loses braking effect quite fast?","Drum brake",["Disc brake","Hydraulic brake","Integral brake"],"Disc brakes shed heat quickly, drain brake dust well and are not vulnerable to water and dust."],
[2,22,"Which of these should be checked briefly before moving off?","Brakes, brake light, lights, indicators, horn, oil, fuel, tyres and load fixing",["Brakes, lights, horn, oil, fuel, tyres and a full engine tune-up at the workshop","Brakes, headlight, indicators, horn, coolant, chain, wheel alignment and engine tuning","Brakes, brake light, horn, tyre tread, chain tension, battery acid and spark plug gaps"],""],
[2,22,"What does 'road and operational safety' mean?","The roadworthiness and perfect condition of the most important technical parts of the bike",["The legal condition of the licence disc, number plate and insurance papers of the bike","The cleanliness and good looks of the most visible body parts of the bike","The speed limit and maximum safe load that the manufacturer allows for the bike"],"Repairs of defective parts must be done by an authorised garage."],
[2,22,"What can you check by operating the foot brake pedal?","Linkage function, hydraulic leaks, lever damage and the brake light switch",["Chain tension, hydraulic leaks, fork damage and the indicator relay","Linkage function, tyre pressure, lever damage and the speedometer cable","Pad thickness, oil leaks, lever height and the horn switch"],""],
[2,23,"How should you adjust your mirror?","Left hand on the handlebar, right hand adjusts the mirror, and vice versa",["Stand beside the bike, tilt the mirror to show your helmet, and vice versa","Adjust it while riding at low speed with your free hand, and vice versa","Sit with both hands on the grips and ask a pillion to tilt the mirror"],""],
[2,23,"What happens if the headlight is aligned too high?","It glares oncoming traffic, even during daylight",["It lights up the road poorly, even during daylight","It dazzles oncoming traffic, but only at night","It overheats the bulb, even during daylight"],"Too low aligned means the distance is insufficiently lit. Lights-on is compulsory at all times."],
[2,24,"Which additional front lights are permitted?","Fog and spot lights",["Strobe and flood lights","Blue and amber lights","Neon and underglow lights"],"The front system consists of a parking light, headlamp for low and high beam, indicators and instrument light."],
[2,24,"Which is part of the rear lighting system?","Brake light, rear light, reflectors, number plate light and indicators",["Brake light, tail lamp, reflectors, spot lamps and a reversing light","Brake light, rear light, mirror lights, number plate light and a siren","Brake light, rear light, reflectors, parking light and high beam"],"An additional rear fog light is permitted."],
[2,25,"Which items should you check regularly?","Water, oil, tyre pressure, petrol and the electrical system",["Water, oil, tyre pressure, petrol and the clutch cable length","Water, oil, wheel balance, petrol and the exhaust paint","Coolant, oil, tyre brand, petrol and the speedometer"],"The emergency set: first-aid box, tyre repair kit, spare bulbs, fuses."],
[2,26,"What should you remember when checking the oil level?","Use the correct oil type, keep to change intervals and make sure the bike is level",["Use any oil of similar colour, keep to change intervals and check it while the bike is leaning","Use the correct oil type, change it only when it looks dirty and keep the bike on its side stand","Use thicker oil in summer, keep to change intervals and top up while the engine is running"],""],
[2,26,"What should you know about tyre pressure?","Check it when the tyre is cold and increase it according to the handbook when loaded",["Check it when the tyre is hot and decrease it according to the handbook when loaded","Check it when the tyre is cold and decrease it according to the handbook when loaded","Check it when the tyre is warm and increase it by half a bar when loaded"],"Increase slightly (about 0.2 bar) for long freeway rides."],
[2,27,"What is the legal minimum tread depth for a heavy motorbike?","1.6 mm",["1 mm","3 mm","0.8 mm"],"Light motorbikes, mopeds and motor-assisted bicycles: 1 mm. The handbook advises changing tyres already at 3 mm."],
[2,27,"Why is tread depth important?","It displaces water and reduces aquaplaning",["It cools the tyre and reduces rolling noise","It stores heat and increases tyre grip","It absorbs bumps and reduces vibration"],"Measure it at several places and look for tread wear indicators."],
[2,28,"Which fuel is preferred if possible?","Unleaded fuel",["Premium leaded fuel","Diesel blended fuel","Racing fuel"],"If necessary, switch the petrol cock to reserve."],
[2,28,"What should you remember about the battery?","Check its mounting; the ventilation pipe must be free of kinks with its end underneath the bike",["Check its mounting; the ventilation pipe must be sealed with a plug and its end near the exhaust","Check its terminals; the ventilation pipe must be bent upward with its end near the seat","Check its fluid level; sealed batteries must be topped up with distilled water every month"],"Most batteries are sealed and maintenance free. Check the state of charge and grease the terminals."],
[2,29,"Which items belong to emergency equipment?","Tyre inflation spray, puncture aids, tools, spare spark plugs, duck tape and a first-aid kit",["Tyre inflation spray, puncture aids, tools, a spare helmet, a torch and a fire blanket","Tyre inflation spray, puncture aids, a jack, spare brake pads, rope and a warning siren","A spare tyre, puncture aids, tools, spare spark plugs, a tow rope and a fire extinguisher"],""],
[2,30,"How can the steering stem bearing be checked?","Relieve the front wheel and move the handlebar side to side; it must move freely",["Load the front wheel and move the handlebar side to side; it must resist slightly","Relieve the rear wheel and rock the bike back and forth; it must not move at all","Relieve the front wheel and push the fork up and down; the handlebar must stay stiff"],"Resistance or jerking means the bearing is worn out."],
[2,31,"How do you check the wheel bearing?","Lift the wheel and move it back and forth; there should be no free-play on the axle",["Lift the wheel and spin it by hand; there should be a slight free-play on the axle","Lift the wheel and move it up and down; there should be a little free-play on the axle","Load the wheel and rock the bike sideways; there should be no noise from the axle"],""],
[2,31,"What can happen if a drive chain is too loose?","It can jump off",["It can snap","It can seize up","It can stall the engine"],"A chain that is too tight can snap. Correct lubrication improves wear-free running."],
[2,32,"How do you check shock absorbers?","Check bolts and nuts, look for leaking oil and check bounce when the bike is stationary",["Check bolts and nuts, look for loose springs and check braking when the bike is moving","Check chain and sprockets, look for leaking oil and check bounce when the bike is moving","Check bolts and nuts, look for worn tyres and check swing when the bike is on its stand"],""],
[2,33,"What should be done when taking the bike off the road for a long period?","Fill the tank, remove the battery and store it cool, protect chrome and increase tyre pressure",["Empty the tank, remove the battery and store it warm, protect chrome and lower tyre pressure","Fill the tank, leave the battery connected and trickle charged, protect chrome and keep tyres flat","Fill the tank, remove the battery and store it cool, grease the chain and lower tyre pressure"],"Also change the oil and lift the bike off the ground to relieve the bearings."],
[2,33,"What should you do when putting a bike back on the road after a long period?","Check all technical systems and your own riding ability",["Check the battery and fuel, then ride out gently onto a busy road","Check the paintwork and chrome and your own cold weather clothing","Check all technical systems, then join a group ride straight away"],"Practise in open areas and consider refresher lessons."],
[2,34,"What is an advantage of a catalytic converter?","Cleaner exhaust emissions with reduced CO",["Quieter exhaust noise with reduced vibration","Lower fuel use with reduced engine heat","Smoother engine start with reduced oil use"],""],
[2,34,"How can you avoid harassing others with noise?","Avoid unnecessary revving, such as at red robots",["Warm up the engine by revving, such as at red robots","Fit a louder exhaust so others hear you, such as at robots","Keep the revs high to warn pedestrians, such as at zebra crossings"],"Bad behaviour hurts the reputation of all riders. The 2005 slogan is 'Loud is out'."],
[2,35,"What are the rules for a moped (Class A2)?","Minimum age 16, engine not over 50 cc, maximum speed 40 km/h",["Minimum age 16, engine not over 125 cc, maximum speed 60 km/h","Minimum age 18, engine not over 50 cc, maximum speed 40 km/h","Minimum age 14, engine not over 50 cc, maximum speed 60 km/h"],""],
[2,35,"What are the rules for a light motorbike (Class A1)?","Minimum age 18, engine over 50 cc but not more than 125 cc, max 60 km/h",["Minimum age 16, engine over 50 cc but not more than 125 cc, max 60 km/h","Minimum age 18, engine over 125 cc but not more than 250 cc, max 90 km/h","Minimum age 21, engine over 50 cc but not more than 125 cc, max 40 km/h"],"Most 50 cc scramblers can do 90 km/h."],
[2,36,"Which licence class is needed for a heavy motorbike (engine over 250 cc)?","Class A",["Class A1","Class A2","Class M"],"Class A: minimum age 21 internationally (18 in Botswana)."],
[2,36,"What is the minimum age for Class A in Botswana, according to the handbook?","18 years",["16 years","21 years","25 years"],"The handbook says 21 internationally, but 18 in Botswana."],
[2,36,"A medium motorbike (engine not exceeding 250 cc) needs which licence class?","Class A1",["Class A","Class A2","Class M"],"The medium bike needs Class A1, minimum age 18."],
[2,38,"Which documents may a police officer demand from a rider?","Licensing disc, number plate, driving licence card and insurance proof",["Licensing disc, helmet certificate, driving licence card and tax clearance","Number plate, driving licence card, insurance proof and a medical certificate","Licensing disc, rider's logbook, passport and insurance proof"],"If documents are lost, new ones must be obtained from the Licensing Department."],
[3,40,"What is needed for correct handling of a motorbike?","Control at all times, correct technique, good eyesight and knowledge of riding-related physics",["Control at low speeds, correct footwear, good hearing and knowledge of engine mechanics","Control in good weather, correct technique, fast reflexes and knowledge of the area's roads","Strength at all times, correct posture, good eyesight and knowledge of traffic signs"],""],
[3,40,"When does a motorbike tend to tip over?","In sudden stops when cornering, when a foot goes in a puddle or on slippery ground, or if the pillion moves",["In sudden stops when riding straight, when a foot goes on dry tar, or if the pillion sits still","In gentle stops when cornering, when a foot goes on smooth tar, or if the engine keeps running","In sudden stops when cornering, when a foot goes on dry tar, or if the seat is set too low"],"Stalling the engine or a seating position that is too high can also tip the bike."],
[3,41,"What should you do at the clutch friction point?","Find it carefully and hold the lever there, then release the clutch to move off",["Find it carefully, hold the lever there, then pull in the clutch again to move off","Release the lever fully at once, then add throttle to move off smoothly","Find it carefully and release the lever quickly, then rev the engine to move off"],""],
[3,41,"Why do you accelerate slightly when moving off?","It prevents stalling, and once moving it is easier to keep your balance",["It warms the engine, and once moving it is easier to select first gear","It prevents wheelspin, and once moving it is easier to hold the clutch lever","It cools the clutch, and once moving it is easier to find the friction point"],""],
[3,41,"Where is neutral on a motorbike gearbox?","Between 1st and 2nd gear",["Between 2nd and 3rd gear","Between 3rd and 4th gear","Just below 1st gear"],"Neutral is often shown by a green control light. Gears are shifted one by one."],
[3,42,"When should you stop with your right foot down?","When the road slopes to the left, or when turning right from standstill",["When the road slopes to the right, or when turning right from standstill","When the road slopes to the left, or when turning left from standstill","When the road slopes to the right, or when turning left from standstill"],"Also when shifting gears at standstill."],
[3,42,"When should you stop with your left foot down?","When turning left from standstill, or when the road slopes to the right",["When turning right from standstill, or when the road slopes to the right","When turning left from standstill, or when the road slopes to the left","When turning right from standstill, or when the road slopes to the left"],"Also for the rear brake when moving off at an incline."],
[3,42,"Which is a means used to protect a bike against theft?","Steering lock, chain lock, disc brake lock or an alarm system",["Spare key under the seat, chain lock, mirror lock or a dashboard sticker","Hiding the number plate, shackle lock, helmet lock or a loud exhaust","Fuel tap left on reserve, chain lock, wheel chocks or a mirror alarm"],""],

[4,56,"What is the 'safety cushion' on a winding road?","Always choosing a safe line, correct speed and correct gear",["Keeping a wide gap, constant speed and a fixed middle gear","Always choosing the racing line, high speed and a low gear","Choosing the shortest line, correct speed and neutral gear"],"When cornering a bike uses the width of a light vehicle."],

[5,84,"What is a benefit of riding at low engine revs?","Lower fuel consumption, calmer riding and less noise",["Lower fuel consumption, engine damage and less power","Higher fuel consumption, calmer riding and less noise","Lower fuel consumption, faster riding and more noise"],"It does not harm the engine (do not confuse it with under-revving)."],

[6,85,"Does the right of way apply to motorbike riders?","Yes, but other road users do not necessarily wait for you",["No, the right of way applies only to cars and trucks","Yes, and other road users always wait for you to pass","No, riders must give way to every vehicle at junctions"],""],
[6,86,"What is the correct behaviour concerning right of way?","Try to get visual contact, slow down, be ready to brake and keep your distance from large vehicles",["Try to avoid eye contact, speed up, be ready to hoot and stay close to large vehicles","Try to get visual contact, slow down, be ready to brake and overtake large vehicles quickly","Try to get visual contact, hold your speed, be ready to hoot and ride close beside large vehicles"],"Do not overtake a vehicle that is turning off."],
[6,88,"What should you do on roads with oncoming traffic?","Slow down, be ready to brake and ride visibly in the middle of the lane with dipped headlights",["Slow down, be ready to hoot and ride on the lane edge with the headlight switched off","Speed up, be ready to brake and ride visibly in the middle of the lane with high beam on","Slow down, be ready to brake and ride at the road edge with dipped headlights"],""],

[6,90,"Where may slow vehicles suddenly turn off or swing out?","At plot entries, field and forest turn-offs, agricultural businesses",["At motorway exits, bridge approaches and long straight rural stretches","At pedestrian crossings, taxi ranks and shopping centre entrances","At junctions with robots, filling stations and long tunnels"],"Only overtake when the situation is clear, with a wide side distance."],

[6,92,"Why can sunset be troublesome to riders?","You can be dazzled easily",["The road surface gets slippery","Your engine overheats faster","Your tyres lose pressure"],"A scratch-free visor or sunglasses help. Be careful when the sun visor is turned down."],

<script>
"use strict";
// ---------- storage ----------
const KEY = "motorbike-theory-class-a";
let S = { q: {}, mocks: [], mode: "exam", attempts: {} };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- items ----------
function hash(s){ let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) | 0; return "k" + (x >>> 0).toString(36); }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

const SIGN4 = [
  [1, "No overtaking (all vehicles, motorbikes included)"],
  [2, "No entry for all motor vehicles (motorbikes included)"],
  [3, "You may only push your motorbike"],
  [4, "No entry for all motorbikes (also with sidecars)"]
];
// decoy pool for sign questions: same kind of sign first, never two names for the same sign
const FAM = f => f[0] === "w" ? "w" : f[0] === "r" ? "r" : "i";
const SAME = { "r222.png": "nomc", "r247.png": "nomv" };       // same meaning as sign 4 / sign 2 in the p.58 picture
const SIGN_POOL = SIGNS.map(s => ({ name: s[1], fam: FAM(s[0]), g: SAME[s[0]] || s[0] }))
  .concat(SIGN4.map(s => ({ name: s[1], fam: "r", g: s[0] === 4 ? "nomc" : s[0] === 2 ? "nomv" : "p58-" + s[0] })))
  .concat([
    ["No parking for motorbikes", "r"], ["Motorbikes must stop here", "r"], ["Speed limit for motorbikes", "r"],
    ["Narrow bridge ahead", "w"], ["Pedestrian crossing ahead", "w"], ["Slow moving vehicles ahead", "w"],
    ["Taxi rank ahead", "i"], ["Petrol station ahead", "i"], ["Hospital ahead", "i"]
  ].map(([name, fam]) => ({ name, fam, g: name })));

const ITEMS = [];
Q.forEach(([lesson, page, q, correct, wrong, exp]) => {
  ITEMS.push({ id: hash(q), kind: "q", lesson, ref: "Lesson " + lesson + " · BIKE.pdf p." + page, q, correct, wrong, exp });
});
SIGNS.forEach(([file, name, exp]) => {
  ITEMS.push({ id: hash("sign" + file), kind: "sign", lesson: "S", ref: "Traffic signs", q: "What does this sign mean?", img: IMG[file], correct: name, fam: FAM(file), g: SAME[file] || file, exp });
});
SIGN4.forEach(([n, name]) => {
  ITEMS.push({ id: hash("sign4-" + n), kind: "sign", lesson: "S", ref: "Traffic signs · Lesson 4 p.58", q: "What does sign " + n + " (in the picture) mean?", img: IMG["signs4.jpg"], wide: true, correct: name, fam: "r", g: n === 4 ? "nomc" : n === 2 ? "nomv" : "p58-" + n, exp: "Handbook Lesson 4: " + name + "." });
});

function optionsFor(it){
  let wrong = it.wrong;
  if (it.kind === "sign") {
    const pool = SIGN_POOL.filter(p => p.g !== it.g);
    const pick = [], used = new Set([it.g]);
    // same kind of sign first (a warning triangle gets warning-sign decoys), then fill up from the rest
    for (const p of shuffle(pool.filter(p => p.fam === it.fam)).concat(shuffle(pool.filter(p => p.fam !== it.fam)))) {
      if (pick.length === 3) break;
      if (!used.has(p.g)) { used.add(p.g); pick.push(p.name); }
    }
    wrong = pick;
  }
  return shuffle([{ t: it.correct, ok: true }].concat(wrong.map(t => ({ t, ok: false }))));
}
const rec = id => S.q[id] || (S.q[id] = { r: 0, w: 0, last: null });
const byLesson = l => ITEMS.filter(i => String(i.lesson) === String(l));

// ---------- views ----------
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let run = null;

function pct(n, d){ return d ? Math.round(100 * n / d) : 0; }

function home(){
  run = null;
  const seen = ITEMS.filter(i => S.q[i.id] && S.q[i.id].last !== null);
  const right = seen.filter(i => S.q[i.id].last).length;
  const missed = ITEMS.filter(i => S.q[i.id] && S.q[i.id].last === false);
  const lessonKeys = Object.keys(LESSONS).concat(["S"]);
  const lessonName = k => k === "S" ? "Traffic signs" : LESSONS[k];

  app.innerHTML = `
    <h1>Motorbike theory practice</h1>
    <p class="sub">Class A (A2 / A1 / A) · based on the Botswana DRTS Motorbike Syllabus, 2005 · ${ITEMS.length} questions</p>

    <div class="card">
      <div class="row between"><b>Your progress</b><span class="tag">${right} of ${ITEMS.length} answered correctly last time</span></div>
      <div class="bar ok"><i style="width:${pct(right, ITEMS.length)}%"></i></div>
    </div>

    <h2>Start</h2>
    <div class="seg">
      <button data-a="mode" data-m="exam" class="${S.mode === "exam" ? "on" : ""}">Exam style</button>
      <button data-a="mode" data-m="practice" class="${S.mode === "practice" ? "on" : ""}">Practice (instant feedback)</button>
    </div>
    <p class="sub" style="margin-top:-6px">${S.mode === "exam" ? "Answer every question, then get your score and review. You can go back and change answers. Pass mark 80%." : "You see the right answer and the handbook point after each question."}</p>
    <div class="grid">
      <button class="tile" data-a="mock"><b>Mock test</b><span>30 mixed questions, 5 of them traffic signs</span></button>
      <button class="tile" data-a="mistakes" ${missed.length ? "" : "disabled"}><b>Review my mistakes</b><span>${missed.length} question${missed.length === 1 ? "" : "s"} to fix</span></button>
      <button class="tile" data-a="all"><b>Everything, shuffled</b><span>All ${ITEMS.length} questions</span></button>
      <button class="tile" data-a="cards"><b>Study cards</b><span>Read the answer first, no scoring</span></button>
    </div>

    <h2>By chapter</h2>
    <div class="grid">
      ${lessonKeys.map(k => {
        const its = byLesson(k), ok = its.filter(i => S.q[i.id] && S.q[i.id].last).length;
        return `<button class="tile" data-a="lesson" data-l="${k}"><b>${k === "S" ? "Signs" : "Lesson " + k}: ${esc(lessonName(k))}</b><span>${its.length} questions · ${ok} correct</span><div class="bar ok"><i style="width:${pct(ok, its.length)}%"></i></div></button>`;
      }).join("")}
    </div>

    ${S.mocks.length ? `<h2>Recent mock tests</h2><div class="card">${S.mocks.slice(-5).reverse().map(m => `<div class="row between"><span>${esc(m.date)}</span><b>${m.score}/${m.total} (${pct(m.score, m.total)}%)</b></div>`).join("")}</div>` : ""}

    <p class="sub" style="margin-top:28px">These are practice questions written from the handbook, not the official test bank. Your results are saved in this browser only. <button class="link" data-a="reset">Reset progress</button></p>`;

  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "mode") { S.mode = b.dataset.m; save(); home(); }
    else if (a === "mock") startMock();
    else if (a === "mistakes") start(shuffle(missed), "Review mistakes");
    else if (a === "all") start(shuffle(ITEMS), "All questions");
    else if (a === "cards") startCards();
    else if (a === "lesson") start(shuffle(byLesson(b.dataset.l)), (b.dataset.l === "S" ? "Traffic signs" : "Lesson " + b.dataset.l), false, "chapter-" + b.dataset.l);
    else if (a === "reset" && confirm("Clear all saved progress?")) { S = { q: {}, mocks: [], mode: S.mode, attempts: {} }; save(); home(); }
  });
}

function startMock(){
  const signs = shuffle(ITEMS.filter(i => i.kind === "sign")).slice(0, 5);
  const rest = shuffle(ITEMS.filter(i => i.kind === "q")).slice(0, 25);
  start(shuffle(signs.concat(rest)), "Mock test", true, "mock");
}

function start(items, title, isMock, key){
  if (!items.length) return home();
  run = { items, i: 0, title, isMock: !!isMock, key: key || title, exam: S.mode === "exam",
          optsList: items.map(optionsFor), sel: items.map(() => null), results: [], opts: null, answered: false };
  question();
}

function header(){
  return `<div class="row between"><button class="link" data-x="quit">← Quit</button><span class="tag">${esc(run.title)} · ${run.i + 1} / ${run.items.length}</span></div>
    <div class="bar"><i style="width:${pct(run.i, run.items.length)}%"></i></div>`;
}
function body(it, opts, sel){
  return `<p class="tag" style="margin-top:18px">${esc(it.ref)}</p>
    <div class="q">${esc(it.q)}</div>
    ${it.img ? `<img class="signimg ${it.wide ? "wide" : ""}" src="${it.img}" alt="Traffic sign">` : ""}
    <div id="opts">${opts.map((o, n) => `<button class="opt ${sel === n ? "sel" : ""}" data-n="${n}"><kbd>${n + 1}</kbd>${esc(o.t)}</button>`).join("")}</div>`;
}
function wireQuit(){
  app.querySelector("[data-x=quit]").onclick = () => { if ((run.exam ? !run.sel.some(x => x !== null) : !run.results.length) || confirm("Quit this session?")) home(); };
}

function question(){ run.exam ? examQuestion() : practiceQuestion(); }

// ----- exam style: answer all, change freely, score at the end -----
function examQuestion(){
  const it = run.items[run.i], opts = run.optsList[run.i], last = run.i === run.items.length - 1;
  app.innerHTML = header() + body(it, opts, run.sel[run.i]) + `
    <p class="row" style="margin-top:16px">
      <button class="btn ghost" id="back" ${run.i ? "" : "disabled"}>← Back</button>
      <button class="btn" id="fwd" ${run.sel[run.i] === null ? "disabled" : ""}>${last ? "Finish" : "Next →"}</button>
      <span class="tag" id="hint">${run.sel[run.i] === null ? "Choose an answer to continue" : ""}</span>
    </p>`;
  wireQuit();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.n));
  document.getElementById("back").onclick = examBack;
  document.getElementById("fwd").onclick = examNext;
}
function pick(n){
  run.sel[run.i] = n;
  app.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("sel", k === n));
  document.getElementById("fwd").disabled = false;
  document.getElementById("hint").textContent = "";
}
function examBack(){ if (run.i > 0) { run.i--; examQuestion(); } }
function examNext(){
  if (run.sel[run.i] === null) return;
  if (run.i < run.items.length - 1) { run.i++; examQuestion(); }
  else {
    const unanswered = run.sel.filter(x => x === null).length;
    if (unanswered) { alert("You skipped " + unanswered + " question(s). Use Back to answer them."); return; }
    finishExam();
  }
}
function finishExam(){
  run.results = run.items.map((it, i) => { const o = run.optsList[i][run.sel[i]]; return { it, ok: o.ok, picked: o.t, correct: it.correct }; });
  run.results.forEach(r => { const q = rec(r.it.id); r.ok ? q.r++ : q.w++; q.last = r.ok; });
  S.attempts[run.key] = (S.attempts[run.key] || 0) + 1;
  const score = run.results.filter(r => r.ok).length, total = run.results.length;
  if (run.isMock) { S.mocks.push({ date: new Date().toLocaleDateString(), score, total }); S.mocks = S.mocks.slice(-20); }
  save();
  scoreScreen();
}
function scoreScreen(){
  const total = run.results.length, ok = run.results.filter(r => r.ok).length, acc = pct(ok, total), pass = acc >= 80;
  const wrong = run.results.filter(r => !r.ok);
  app.innerHTML = `
    <h1>${esc(run.title)}</h1>
    <div class="card">
      <div class="stats">
        <span>Your Score:</span><b>${ok * 10}</b>
        <span>Max Score:</span><b>${total * 10}</b>
        <span>Questions Correct:</span><b>${ok}</b>
        <span>Number of Questions:</span><b>${total}</b>
        <span>Accuracy:</span><b>${acc}%</b>
        <span>Number of Quiz Attempts:</span><b>${S.attempts[run.key] || 1}</b>
      </div>
      <div class="verdict ${pass ? "pass" : "fail"}">${pass ? "Passed" : "Not passed yet"} <span class="tag">pass mark 80%</span></div>
    </div>
    <div class="row" style="margin:16px 0">
      <button class="btn" id="again">Try again</button>
      ${wrong.length ? `<button class="btn ghost" id="retry">Retry the ${wrong.length} I missed</button>` : ""}
      <button class="btn ghost" id="home">Back to start</button>
    </div>
    <h2>Review your answers</h2>
    <div class="card">${run.results.map((r, n) => `<div class="miss">
      <div class="tag">${n + 1}. ${esc(r.it.ref)}</div>
      <b>${esc(r.it.q)}</b>
      <div><span class="pill ${r.ok ? "ok" : "bad"}">${r.ok ? "You answered this correctly!" : "You did not answer this correctly"}</span></div>
      ${r.ok ? "" : `<div>Your answer: ${esc(r.picked)}</div>`}
      <div style="color:var(--ok)">The correct answer is: ${esc(r.it.correct)}</div>
      ${r.it.exp ? `<div class="sub" style="margin:4px 0 0">${esc(r.it.exp)}</div>` : ""}</div>`).join("")}</div>`;
  document.getElementById("home").onclick = home;
  document.getElementById("again").onclick = () => start(shuffle(run.items), run.title, run.isMock, run.key);
  const rb = document.getElementById("retry");
  if (rb) rb.onclick = () => start(shuffle(wrong.map(r => r.it)), "Retry", false, "retry");
}

// ----- practice: instant feedback -----
function practiceQuestion(){
  const it = run.items[run.i];
  run.opts = run.optsList[run.i]; run.answered = false;
  app.innerHTML = header() + body(it, run.opts, null) + `<div id="after"></div>`;
  wireQuit();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.n));
}

function answer(n){
  if (run.answered) return;
  run.answered = true;
  const it = run.items[run.i], ok = run.opts[n].ok, r = rec(it.id);
  ok ? r.r++ : r.w++; r.last = ok; save();
  run.results.push({ it, ok, picked: run.opts[n].t });
  app.querySelectorAll(".opt").forEach((b, k) => {
    b.disabled = true;
    if (run.opts[k].ok) b.classList.add("ok");
    else if (k === n) b.classList.add("bad");
  });
  const last = run.i === run.items.length - 1;
  document.getElementById("after").innerHTML = `
    <p><span class="pill ${ok ? "ok" : "bad"}">${ok ? "Correct" : "Not quite"}</span></p>
    ${it.exp ? `<div class="exp">${esc(it.exp)}</div>` : ""}
    <p><button class="btn" id="next">${last ? "See results" : "Next question"}</button> <span class="tag">Enter</span></p>`;
  document.getElementById("next").onclick = next;
}

function next(){
  if (run.i < run.items.length - 1) { run.i++; question(); } else results();
}

function results(){
  const score = run.results.filter(r => r.ok).length, total = run.results.length;
  S.attempts[run.key] = (S.attempts[run.key] || 0) + 1;
  if (run.isMock) { S.mocks.push({ date: new Date().toLocaleDateString(), score, total }); S.mocks = S.mocks.slice(-20); }
  save();
  const wrong = run.results.filter(r => !r.ok);
  app.innerHTML = `
    <h1>${esc(run.title)} finished</h1>
    <div class="card"><div class="big">${score}/${total}</div><div class="sub" style="margin:6px 0 0">${pct(score, total)}% correct</div></div>
    <div class="row" style="margin:16px 0">
      ${wrong.length ? `<button class="btn" id="retry">Retry the ${wrong.length} I missed</button>` : ""}
      <button class="btn ghost" id="home">Back to start</button>
    </div>
    ${wrong.length ? `<h2>What you missed</h2><div class="card">${wrong.map(r => `<div class="miss"><div class="tag">${esc(r.it.ref)}</div><b>${esc(r.it.q)}</b><div>Your answer: ${esc(r.picked)}</div><div style="color:var(--ok)">Correct: ${esc(r.it.correct)}</div>${r.it.exp ? `<div class="sub" style="margin:4px 0 0">${esc(r.it.exp)}</div>` : ""}</div>`).join("")}</div>` : "<p>Perfect round.</p>"}`;
  document.getElementById("home").onclick = home;
  const rb = document.getElementById("retry");
  if (rb) rb.onclick = () => start(shuffle(wrong.map(r => r.it)), "Retry", false, "retry");
}

// ---------- study cards ----------
function startCards(){
  run = { cards: shuffle(ITEMS), i: 0 };
  card(false);
}
function card(show){
  const it = run.cards[run.i];
  app.innerHTML = `
    <div class="row between"><button class="link" data-x="quit">← Back</button><span class="tag">Study cards · ${run.i + 1} / ${run.cards.length}</span></div>
    <div class="card flash" style="margin-top:14px">
      <p class="tag">${esc(it.ref)}</p>
      <div class="q">${esc(it.q)}</div>
      ${it.img ? `<img class="signimg ${it.wide ? "wide" : ""}" src="${it.img}" alt="Traffic sign">` : ""}
      ${show ? `<div class="exp"><b>${esc(it.correct)}</b>${it.exp ? `<div style="margin-top:6px">${esc(it.exp)}</div>` : ""}</div>` : ""}
    </div>
    <p class="row" style="margin-top:14px">
      ${show ? `<button class="btn" id="cn">Next card</button>` : `<button class="btn" id="cs">Show answer</button>`}
      <button class="btn ghost" id="cp" ${run.i ? "" : "disabled"}>Previous</button>
    </p>`;
  app.querySelector("[data-x=quit]").onclick = home;
  const cs = document.getElementById("cs"), cn = document.getElementById("cn");
  if (cs) cs.onclick = () => card(true);
  if (cn) cn.onclick = () => { run.i = (run.i + 1) % run.cards.length; card(false); };
  document.getElementById("cp").onclick = () => { run.i--; card(false); };
}

// ---------- keyboard ----------
document.addEventListener("keydown", e => {
  if (!run || !run.items || !app.querySelector(".opt")) return;
  if (run.exam) {
    if (/^[1-4]$/.test(e.key)) pick(+e.key - 1);
    else if (e.key === "Enter") examNext();
    else if (e.key === "ArrowLeft") examBack();
    return;
  }
  if (!run.answered && /^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if (run.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
});

home();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
